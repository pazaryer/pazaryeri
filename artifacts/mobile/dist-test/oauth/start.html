<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pazaryeri — Google ile Giriş</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #3D1A78 0%, #1A0A2E 100%);
      color: #fff;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
      color: #1A0A2E;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      color: #3D1A78;
      letter-spacing: -0.5px;
    }
    .site {
      font-size: 13px;
      color: #7A6B8A;
      margin-top: 4px;
      margin-bottom: 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 3px solid #E8E0F4;
      border-top-color: #3D1A78;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 14px; color: #7A6B8A; line-height: 1.5; }
    .err { color: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Pazaryeri</div>
    <div class="site">pazaryeri0.web.app</div>
    <div class="spinner" id="spin"></div>
    <p class="msg" id="msg">Google hesabınıza yönlendiriliyorsunuz…</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var ret = params.get('return') || 'pazaryeri://auth';
      var msg = document.getElementById('msg');
      var spin = document.getElementById('spin');
      var api =
        'https://pazaryerim.onrender.com/api/auth/google/url?return=' +
        encodeURIComponent(ret);
      fetch(api)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.url) throw new Error(d.error || 'Google bağlantısı kurulamadı');
          location.replace(d.url);
        })
        .catch(function (e) {
          if (spin) spin.style.display = 'none';
          if (msg) {
            msg.textContent = (e && e.message) || 'Bağlantı hatası';
            msg.className = 'msg err';
          }
        });
    })();
  </script>
</body>
</html>

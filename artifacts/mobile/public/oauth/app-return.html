<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pazaryeri — Giriş</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f7f5fc;
      color: #1a0a2e;
      text-align: center;
      padding: 24px;
    }
    .ok { color: #3d1a78; font-weight: 700; font-size: 18px; }
    .sub { color: #7a6b8a; margin-top: 8px; font-size: 14px; }
    .err { color: #b42318; font-weight: 600; }
  </style>
</head>
<body>
  <div id="box">
    <p class="ok">Giriş tamamlanıyor…</p>
    <p class="sub">Bu pencere otomatik kapanacak.</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var idToken = params.get('id_token');
      var err = params.get('error');
      var box = document.getElementById('box');

      if (err) {
        box.innerHTML = '<p class="err">Giriş tamamlanamadı</p><p class="sub">' + err + '</p>';
        return;
      }

      if (idToken) {
        box.innerHTML = '<p class="ok">Giriş başarılı</p><p class="sub">Uygulamaya dönülüyor…</p>';
        return;
      }

      box.innerHTML = '<p class="sub">Oturum bilgisi alınamadı. Uygulamaya dönüp tekrar deneyin.</p>';
    })();
  </script>
</body>
</html>

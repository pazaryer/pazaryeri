<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa Bulunamadı — Pazaryeri</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(165deg, #3D1A78 0%, #1A0A2E 100%);
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    .box {
      max-width: 400px;
      background: #fff;
      color: #1A0A2E;
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    h1 { margin: 0 0 8px; font-size: 48px; color: #3D1A78; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    p { margin: 0 0 24px; color: #7A6B8A; font-size: 14px; line-height: 1.5; }
    a {
      display: inline-block;
      background: #3D1A78;
      color: #fff;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
    }
    a:hover { background: #2A1260; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Sayfa bulunamadı</h2>
    <p>Aradığınız sayfa mevcut değil veya taşınmış olabilir.</p>
    <a href="/">Ana Sayfaya Dön</a>
  </div>
</body>
</html>

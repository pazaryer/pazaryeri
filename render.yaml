services:
  - type: web
    name: pazaryeri
    runtime: node
    nodeVersion: 22
    plan: free
    region: frankfurt
    buildCommand: npm run render-build:ci
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: pazaryeri0
      - key: GOOGLE_CLIENT_ID
        value: 637257074433-gr8vbeupacshsv6omfsf60mn5rkef719.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: API_PUBLIC_URL
        value: https://pazaryerim.onrender.com
      - key: SITE_PUBLIC_URL
        value: https://pazaryeri0.web.app
      - key: IMGBB_API_KEY
        sync: false
      - key: IMGBB_API_KEYS
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAILS
        value: pazaryer0@gmail.com
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false
      - key: ADMOB_ANDROID_APP_ID
        value: ca-app-pub-8045800087063412~8727412358
      - key: ADMOB_ANDROID_BANNER_UNIT_ID
        sync: false
      - key: ADMOB_ANDROID_INTERSTITIAL_UNIT_ID
        sync: false
      - key: ADMOB_ANDROID_REWARDED_UNIT_ID
        sync: false
      - key: ADMOB_FORCE_PRODUCTION
        value: "1"
